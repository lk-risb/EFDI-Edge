# Local, fast checks before a commit leaves this machine. CI remains the
# authoritative, full gate — this catches the same class of problem sooner,
# on only the files actually being committed.
#
# Deliberately does NOT include a code formatter (ruff format, ...): adding
# one now would rewrite thousands of pre-existing lines on first run, same
# reasoning as the parent EFDI project's own .pre-commit-config.yaml.
# Install: `pip install pre-commit && pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]   # a trailing double-space is a real MD line break
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        # Pyflakes-equivalent rules only — matches the parent EFDI project's
        # own scope, not the full default ruleset.
        args: ["--select=F,E9", "--no-fix"]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["-x", "-S", "warning"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
